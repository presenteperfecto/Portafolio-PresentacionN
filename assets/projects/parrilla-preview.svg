<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="parrillaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19110e"/>
      <stop offset="100%" stop-color="#0a0706"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#parrillaBg)"/>
  
  <!-- Subtle warm ambient glow -->
  <circle cx="700" cy="100" r="150" fill="#d35400" opacity="0.05" filter="blur(50px)"/>
  <circle cx="100" cy="400" r="140" fill="#f39c12" opacity="0.03" filter="blur(50px)"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 30)" filter="url(#pShadow)">
    <rect width="720" height="440" rx="10" fill="#15100e" stroke="#2d201c" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect width="720" height="38" rx="10" fill="#201815"/>
    <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5" fill="#27c93f"/>
    <!-- URL Bar -->
    <rect x="160" y="8" width="400" height="22" rx="6" fill="#120c0a" stroke="#2b1e19" stroke-width="1"/>
    <text x="360" y="23" fill="#99847e" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">parrillajuseluis.com — Sitio Comercial & Menú Digital</text>

    <!-- Header Inside -->
    <g transform="translate(0, 38)">
      <rect width="720" height="46" fill="#1c1310" stroke="#2a1c17" stroke-width="1"/>
      <!-- Brand Logo / Fire icon -->
      <path d="M28 32 C24 28 26 22 30 18 C31 22 35 21 34 16 C39 20 42 26 38 32 C36 34 31 34 28 32 Z" fill="#e67e22"/>
      <text x="50" y="29" fill="#ffffff" font-family="'Sora', sans-serif" font-weight="700" font-size="15" letter-spacing="1">PARRILLA JOSÉ LUIS</text>
      <!-- Nav Categories -->
      <text x="250" y="28" fill="#e67e22" font-family="'Inter', sans-serif" font-size="11" font-weight="600">MENÚ DIGITAL</text>
      <text x="360" y="28" fill="#888" font-family="'Inter', sans-serif" font-size="11">CORTES A LA LEÑA</text>
      <text x="495" y="28" fill="#888" font-family="'Inter', sans-serif" font-size="11">UBICACIÓN & MAPA</text>
      <!-- CTA WhatsApp -->
      <rect x="615" y="10" width="85" height="26" rx="5" fill="#25d366"/>
      <text x="657" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">RESERVAR</text>
    </g>

    <!-- Hero / Presentation Banner -->
    <g transform="translate(24, 98)">
      <rect width="672" height="100" rx="8" fill="#1f1411" stroke="#33211b" stroke-width="1"/>
      <text x="30" y="38" fill="#f39c12" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="2">TRADICIÓN & ASADOR CRIOLLO</text>
      <text x="30" y="66" fill="#ffffff" font-family="'Sora', sans-serif" font-size="20" font-weight="700">CARNES SELECCIONADAS AL QUEBRACHO</text>
      <text x="30" y="86" fill="#a8938c" font-family="'Inter', sans-serif" font-size="11">Disfrutá la auténtica experiencia de asado argentino en un ambiente cálido y familiar.</text>
      <rect x="525" y="32" width="120" height="36" rx="6" fill="url(#amberGrad)"/>
      <text x="585" y="55" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">VER CARTA COMPLETA</text>
    </g>

    <!-- Digital Menu (2 cards) + Info/Location Card (1 card) -->
    <!-- Menu Card 1: Bife de Chorizo -->
    <g transform="translate(24, 212)">
      <rect width="215" height="175" rx="6" fill="#18110e" stroke="#2e1d17" stroke-width="1"/>
      <rect x="12" y="12" width="191" height="85" rx="4" fill="#241814"/>
      <!-- Sizzling grill sketch -->
      <line x1="30" y1="55" x2="185" y2="55" stroke="#3a251f" stroke-width="2"/>
      <line x1="30" y1="65" x2="185" y2="65" stroke="#3a251f" stroke-width="2"/>
      <line x1="30" y1="75" x2="185" y2="75" stroke="#3a251f" stroke-width="2"/>
      <rect x="65" y="40" width="85" height="38" rx="8" fill="#4d1e15" stroke="#7a2e20" stroke-width="1.5"/>
      <circle cx="85" cy="59" r="6" fill="#8b3a2b"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Bife de Chorizo Especial</text>
      <text x="16" y="132" fill="#887973" font-family="'Inter', sans-serif" font-size="9.5">Corte de 450g con papas rústicas</text>
      <text x="16" y="156" fill="#f39c12" font-family="'Inter', sans-serif" font-size="13" font-weight="700">$ 19.500</text>
      <rect x="135" y="140" width="68" height="22" rx="4" fill="#261712" stroke="#4a2c22" stroke-width="1"/>
      <text x="169" y="155" fill="#e67e22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PEDIR</text>
    </g>

    <!-- Menu Card 2: Asado de Tira -->
    <g transform="translate(252, 212)">
      <rect width="215" height="175" rx="6" fill="#18110e" stroke="#2e1d17" stroke-width="1"/>
      <rect x="12" y="12" width="191" height="85" rx="4" fill="#241814"/>
      <rect x="65" y="42" width="90" height="32" rx="6" fill="#4d1e15" stroke="#7a2e20" stroke-width="1.5"/>
      <line x1="75" y1="42" x2="75" y2="74" stroke="#e67e22" stroke-width="1"/>
      <line x1="95" y1="42" x2="95" y2="74" stroke="#e67e22" stroke-width="1"/>
      <line x1="115" y1="42" x2="115" y2="74" stroke="#e67e22" stroke-width="1"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Asado de Tira del Centro</text>
      <text x="16" y="132" fill="#887973" font-family="'Inter', sans-serif" font-size="9.5">Cocción lenta a fuego de quebracho</text>
      <text x="16" y="156" fill="#f39c12" font-family="'Inter', sans-serif" font-size="13" font-weight="700">$ 22.000</text>
      <rect x="135" y="140" width="68" height="22" rx="4" fill="#261712" stroke="#4a2c22" stroke-width="1"/>
      <text x="169" y="155" fill="#e67e22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PEDIR</text>
    </g>

    <!-- Info / Google Maps Card -->
    <g transform="translate(480, 212)">
      <rect width="216" height="175" rx="6" fill="#18110e" stroke="#2e1d17" stroke-width="1"/>
      <!-- Map preview box -->
      <g transform="translate(12, 12)">
        <rect width="192" height="70" rx="4" fill="#1e1814" stroke="#33241d" stroke-width="1"/>
        <!-- Road lines -->
        <path d="M0 35 Q96 20 192 40" stroke="#382821" stroke-width="6" fill="none"/>
        <path d="M80 0 L110 70" stroke="#382821" stroke-width="4" fill="none"/>
        <!-- Map Pin -->
        <circle cx="100" cy="30" r="12" fill="#e74c3c" opacity="0.2"/>
        <path d="M100 20 C96 20 93 23 93 27 C93 32 100 38 100 38 C100 38 107 32 107 27 C107 23 104 20 100 20 Z" fill="#e74c3c"/>
        <circle cx="100" cy="26" r="2.5" fill="#ffffff"/>
      </g>
      <text x="16" y="105" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Ubicación & Horarios</text>
      <text x="16" y="122" fill="#887973" font-family="'Inter', sans-serif" font-size="9">📍 Costanera Rafael Obligado</text>
      <text x="16" y="137" fill="#887973" font-family="'Inter', sans-serif" font-size="9">🕒 Mar a Dom 12:00 a 01:00 hs</text>
      <rect x="16" y="146" width="184" height="26" rx="4" fill="#25d366"/>
      <text x="108" y="163" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">CONSULTAR POR WHATSAPP</text>
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(24, 396)">
      <rect width="215" height="26" rx="4" fill="#1c1310" stroke="#2b1a14" stroke-width="1"/>
      <text x="107" y="17" fill="#f39c12" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">✔ Menú organizado por categorías</text>

      <rect x="252" y="0" width="215" height="26" rx="4" fill="#1c1310" stroke="#2b1a14" stroke-width="1"/>
      <text x="359" y="17" fill="#f39c12" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">✔ Integración con Google Maps</text>

      <rect x="480" y="0" width="216" height="26" rx="4" fill="#1c1310" stroke="#2b1a14" stroke-width="1"/>
      <text x="588" y="17" fill="#f39c12" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">✔ Acceso directo a reservas</text>
    </g>
  </g>
</svg>
