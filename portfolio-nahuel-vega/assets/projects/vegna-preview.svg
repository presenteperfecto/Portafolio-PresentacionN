<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="vegnaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#vegnaBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Browser Chrome Frame -->
    <rect width="720" height="440" rx="10" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <rect width="720" height="38" rx="10" fill="#1b1b1b"/>
    <!-- Dots -->
    <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5" fill="#27c93f"/>
    <!-- URL Bar -->
    <rect x="180" y="8" width="360" height="22" rx="6" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
    <text x="360" y="23" fill="#888888" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">vegna.tech — Men's Wear</text>

    <!-- Inside Store Mockup -->
    <!-- Navbar -->
    <g transform="translate(0, 38)">
      <rect width="720" height="45" fill="#0f0f0f" stroke="#222" stroke-width="1"/>
      <!-- Brand Logo text -->
      <text x="30" y="28" fill="#ffffff" font-family="'Sora', sans-serif" font-weight="700" font-size="16" letter-spacing="3">VEGNA</text>
      <!-- Nav Links -->
      <text x="210" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">REMERAS</text>
      <text x="285" y="27" fill="#888888" font-family="'Inter', sans-serif" font-size="11">BUZOS</text>
      <text x="350" y="27" fill="#888888" font-family="'Inter', sans-serif" font-size="11">PANTALONES</text>
      <text x="445" y="27" fill="#888888" font-family="'Inter', sans-serif" font-size="11">COLECCIÓN</text>
      <!-- Search & Cart -->
      <rect x="580" y="10" width="105" height="25" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="632" y="26" fill="url(#goldAcc)" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">CARRITO (2)</text>
    </g>

    <!-- Hero Banner within store -->
    <g transform="translate(24, 98)">
      <rect width="672" height="110" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
      <rect x="0" y="0" width="340" height="110" rx="8" fill="linear-gradient(90deg, #181818 0%, transparent 100%)"/>
      <text x="30" y="42" fill="#d4af37" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="2">TEMPORADA 2026</text>
      <text x="30" y="70" fill="#ffffff" font-family="'Sora', sans-serif" font-size="20" font-weight="700">VESTÍ LO QUE TE REPRESENTA</text>
      <text x="30" y="92" fill="#999999" font-family="'Inter', sans-serif" font-size="11">Prendas de alta calidad con cortes oversize y fit moderno</text>
      <rect x="530" y="38" width="112" height="34" rx="6" fill="#ffffff"/>
      <text x="586" y="59" fill="#000000" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">VER TIENDA</text>
    </g>

    <!-- Product Grid (3 cards) -->
    <!-- Product 1 -->
    <g transform="translate(24, 222)">
      <rect width="210" height="165" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
      <rect x="12" y="12" width="186" height="85" rx="4" fill="#202020"/>
      <!-- Graphic tee preview -->
      <path d="M75 35 L90 25 L120 25 L135 35 L126 48 L115 44 L115 80 L95 80 L95 44 L84 48 Z" fill="#2c2c2c" stroke="#444" stroke-width="1"/>
      <circle cx="105" cy="52" r="6" fill="#d4af37" opacity="0.8"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Remera Boxy Fit Noir</text>
      <text x="16" y="132" fill="#888888" font-family="'Inter', sans-serif" font-size="10">100% Algodón Peinado</text>
      <text x="16" y="152" fill="#d4af37" font-family="'Inter', sans-serif" font-size="12" font-weight="700">$ 32.500</text>
      <rect x="135" y="136" width="62" height="20" rx="4" fill="#282828" stroke="#383838" stroke-width="1"/>
      <text x="166" y="150" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PEDIR</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(254, 222)">
      <rect width="210" height="165" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
      <rect x="12" y="12" width="186" height="85" rx="4" fill="#202020"/>
      <!-- Hoodie preview -->
      <path d="M72 38 L88 28 L105 22 L122 28 L138 38 L126 52 L116 46 L116 82 L94 82 L94 46 L84 52 Z" fill="#282828" stroke="#444" stroke-width="1"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Buzo Hoodie Heavy Olive</text>
      <text x="16" y="132" fill="#888888" font-family="'Inter', sans-serif" font-size="10">Frisa Invisible Premium</text>
      <text x="16" y="152" fill="#d4af37" font-family="'Inter', sans-serif" font-size="12" font-weight="700">$ 58.000</text>
      <rect x="135" y="136" width="62" height="20" rx="4" fill="#282828" stroke="#383838" stroke-width="1"/>
      <text x="166" y="150" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PEDIR</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(484, 222)">
      <rect width="212" height="165" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
      <rect x="12" y="12" width="188" height="85" rx="4" fill="#202020"/>
      <!-- Cargo pant preview -->
      <path d="M85 24 L125 24 L132 82 L112 82 L105 46 L98 82 L78 82 Z" fill="#252525" stroke="#444" stroke-width="1"/>
      <text x="16" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Pantalón Cargo Wide</text>
      <text x="16" y="132" fill="#888888" font-family="'Inter', sans-serif" font-size="10">Gabardina Pesada</text>
      <text x="16" y="152" fill="#d4af37" font-family="'Inter', sans-serif" font-size="12" font-weight="700">$ 54.000</text>
      <rect x="137" y="136" width="62" height="20" rx="4" fill="#282828" stroke="#383838" stroke-width="1"/>
      <text x="168" y="150" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">PEDIR</text>
    </g>

    <!-- Badge Admin & VPS status -->
    <g transform="translate(485, 395)">
      <rect width="210" height="30" rx="5" fill="#111" stroke="#25d366" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="15" cy="15" r="4" fill="#25d366"/>
      <text x="26" y="19" fill="#25d366" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Panel Admin + VPS Hostinger Activo</text>
    </g>
  </g>
</svg>
